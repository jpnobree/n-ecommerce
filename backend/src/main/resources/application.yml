spring:
  application:
    name: atelier-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atelier}
    username: ${DB_USER:atelier}
    password: ${DB_PASSWORD:atelier}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1KB
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Dependências externas não entram no health: SMTP fora do ar não pode tirar a loja do ar
  health:
    mail:
      enabled: false

app:
  version: ${APP_VERSION:dev}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail-from: ${APP_MAIL_FROM:Atelier <nao-responda@atelier.local>}
  auth:
    jwt-private-key: ${JWT_PRIVATE_KEY:}
    jwt-public-key: ${JWT_PUBLIC_KEY:}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # Imagens: S3, Cloudflare R2 ou MinIO (dev). Em produção, public-base-url aponta para a CDN.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:atelier-media}
    access-key: ${STORAGE_ACCESS_KEY:atelier}
    secret-key: ${STORAGE_SECRET_KEY:atelier-dev-secret}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/atelier-media}
    path-style: ${STORAGE_PATH_STYLE:true}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:dev}
  send-default-pii: false

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}

---
# Dados de demonstração (2 mil produtos) para desenvolvimento: SPRING_PROFILES_ACTIVE=seed
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
# Homologação e produção: logs JSON, sem Swagger
spring:
  config:
    activate:
      on-profile: hml,prod
logging:
  structured:
    format:
      console: logstash
# Atrás do load balancer: IP real do cliente via X-Forwarded-For (usado no rate limit)
server:
  forward-headers-strategy: native
# Actuator (health/prometheus) só na porta interna; o load balancer expõe apenas a 8080
management:
  server:
    port: 8081
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
